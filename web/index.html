<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="MDGym — registro de treinos offline. Escolha os músculos no mapa corporal, registre suas séries e acompanhe sua evolução.">
  <meta name="theme-color" content="#0C0B0A">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MDGym">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MDGym</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #0C0B0A;
      overscroll-behavior: none;
    }
    /* The Flutter bundle takes a moment to download and boot. Without this the
       page is just a black rectangle until the first frame is painted. */
    #boot {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      background: #0C0B0A;
      color: #D9A184;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      transition: opacity .35s ease;
    }
    #boot.gone { opacity: 0; pointer-events: none; }
    #boot .mark {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: .14em;
      color: #F5EFE8;
    }
    #boot .bar {
      width: 148px;
      height: 3px;
      border-radius: 3px;
      background: rgba(217, 161, 132, .22);
      overflow: hidden;
    }
    #boot .bar i {
      display: block;
      width: 40%;
      height: 100%;
      border-radius: 3px;
      background: #D9A184;
      animation: slide 1.15s ease-in-out infinite;
    }
    @keyframes slide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }
  </style>
</head>
<body>
  <div id="boot">
    <div class="mark">MDGYM</div>
    <div class="bar"><i></i></div>
  </div>

  <script>
    // Flutter announces its first frame here; drop the splash when it does.
    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('boot');
      if (!boot) return;
      boot.classList.add('gone');
      setTimeout(function () { boot.remove(); }, 400);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
